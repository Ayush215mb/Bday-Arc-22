{
    "display_information":
        {
            "name": "glevoidd",
            "description": "An Agent built with the AI SDK and Chat SDK",
            "background_color": "#2C2D30",
        },
    "features":
        {
            "app_home":
                {
                    "home_tab_enabled": true,
                    "messages_tab_enabled": true,
                    "messages_tab_read_only_enabled": false,
                },
            "bot_user": { "display_name": "glevoidd", "always_online": true },
            "agent_view":
                {
                    "agent_description": "A bot built with the AI SDK and Chat SDK",
                    "suggested_prompts":
                        [
                            {
                                "title": "prompt-1",
                                "message": "Hello, can you help me with my work?",
                            },
                            {
                                "title": "prompt-2",
                                "message": "Hey, Can you inform everyone everyone about next week's meeting",
                            },
                        ],
                },
        },
    "oauth_config":
        {
            "scopes":
                {
                    "bot":
                        [
                            "app_mentions:read",
                            "assistant:write",
                            "channels:history",
                            "channels:read",
                            "chat:write",
                            "groups:history",
                            "groups:read",
                            "im:history",
                            "im:read",
                            "mpim:history",
                            "mpim:read",
                            "reactions:read",
                            "reactions:write",
                            "users:read",
                            "channels:manage",
                            "chat:write.public",
                            "users:read.email",
                        ],
                },
            "pkce_enabled": false,
        },
    "settings":
        {
            "event_subscriptions":
                {
                    "bot_events":
