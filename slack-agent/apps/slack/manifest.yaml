                            "app_context_changed",
                            "app_home_opened",
                            "app_mention",
                            "member_joined_channel",
                            "message.channels",
                            "message.groups",
                            "message.im",
                            "message.mpim",
                        ],
                    "request_url": "https://slack-three-iota.vercel.app/api/webhooks/slack",
                },
            "interactivity":
                {
                    "is_enabled": true,
                    "request_url": "https://slack-three-iota.vercel.app/api/webhooks/slack",
                },
            "org_deploy_enabled": false,
            "socket_mode_enabled": false,
            "is_mcp_enabled": false,
            "token_rotation_enabled": false,
            "app_level_token_rotation_enabled": false,
        },
